    <!-- Loaded here rather than through an @import inside index.css. From the stylesheet
         the browser cannot even begin fetching the font until the main CSS has downloaded
         and parsed, which measured at ~200ms before the request started; until the font
         lands, headings render in a fallback face. Several of them ask for weight 900, and
         no fallback ships one, so the browser fakes it by smearing weight 800 — that
         smearing thickens the hook on Ủ until "THỦY" reads as "THUÝ". Requesting the font
         from the HTML lets it download in parallel with the CSS and shrinks that window.
         Weight 900 must stay in the list for the same reason. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
